name: Frontend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Frontend
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        env:
          VITE_API_BASE_URL: https://adahadapato-003-site2.dtempurl.com
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccg-hope-house-web
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy Frontend to SmarterASP
    needs: build
    runs-on: windows-latest

    # Deploy only after a successful push to main.
    # Pull requests are built and checked but never deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: rccg-hope-house-web
          path: dist

      - name: Locate MSDeploy
        id: msdeploy
        shell: powershell
        run: |
          $possiblePaths = @(
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )

          $msdeploy = $possiblePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $msdeploy) {
            throw "MSDeploy.exe was not found on the GitHub Actions runner."
          }

          "path=$msdeploy" >> $env:GITHUB_OUTPUT

      - name: Deploy Vite dist to SmarterASP
        shell: powershell
        env:
          MSDEPLOY_PATH: ${{ steps.msdeploy.outputs.path }}
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          & "$env:MSDEPLOY_PATH" `
            -verb:sync `
            -source:contentPath="$env:GITHUB_WORKSPACE\dist" `
            -dest:contentPath="$env:WEBSITE_NAME",computerName="$env:SERVER_COMPUTER_NAME",userName="$env:SERVER_USERNAME",password="$env:SERVER_PASSWORD",authType="Basic" `
            -allowUntrusted

          if ($LASTEXITCODE -ne 0) {
            throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

      - name: Deployment completed
        shell: powershell
        run: |
          Write-Host "Frontend successfully deployed to SmarterASP."